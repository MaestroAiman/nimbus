# Reverse proxy unifie (etape 10) : sert le frontend statique et proxifie /api vers
# l'API NestJS, pour n'exposer qu'une seule origine (celle atteinte via Tailscale sur
# le Dell, voir docs/deploiement-dell.md et Structure.md section 2.2/4.1).
#
# Ce fichier est monte (docker-compose.prod.yml, service `web`) par-dessus le
# nginx.conf baque dans l'image (apps/web/nginx.conf) : il peut donc etre ajuste
# directement sur le Dell sans reconstruire ni retransferer l'image.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Taille maximale d'un upload (Nginx repond 413 au-dela ; le navigateur affiche alors
    # une "erreur reseau"). Limite volontairement haute : l'API (multer diskStorage) n'en
    # impose aucune. A ajuster selon l'espace disque du Dell ; Nginx met en tampon le
    # fichier sur disque avant de le transmettre a l'API, prevoir ~2x la taille en libre.
    client_max_body_size 5g;
    # Delai entre deux lectures successives du corps envoye par le client (pas un delai
    # total) : evite de couper un gros upload sur une liaison lente ou instable.
    client_body_timeout 600s;

    # API NestJS : prefixe /api conserve tel quel (pas de slash final apres l'upstream),
    # pour matcher le globalPrefix('api') applique cote NestJS (main.ts).
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend React (SPA) : fallback sur index.html pour les routes client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
