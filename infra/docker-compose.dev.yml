services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nimbus
      POSTGRES_PASSWORD: nimbus
      POSTGRES_DB: nimbus
    ports:
      - '5432:5432'
    volumes:
      - nimbus_pg_dev_data:/var/lib/postgresql/data
    command: >
      postgres
      -c shared_buffers=192MB
      -c work_mem=8MB
      -c max_connections=20
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nimbus -d nimbus']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nimbus_pg_dev_data:
