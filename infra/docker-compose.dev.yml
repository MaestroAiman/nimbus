# `name` explicite : sans cela, Docker Compose derive le nom de projet du nom du dossier
# parent ("infra"), qui entre en collision avec d'autres repos sur cette machine rangeant
# eux aussi leur compose de dev dans un dossier "infra/" (constate : partage du meme reseau
# Docker "infra_default"). Ne change rien au volume Postgres nomme existant.
name: nimbus-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nimbus
      POSTGRES_PASSWORD: nimbus
      POSTGRES_DB: nimbus
    ports:
      - '5432:5432'
    volumes:
      - nimbus_pg_dev_data:/var/lib/postgresql/data
    command: >
      postgres
      -c shared_buffers=192MB
      -c work_mem=8MB
      -c max_connections=20
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nimbus -d nimbus']
      interval: 5s
      timeout: 5s
      retries: 10

  # Conteneur de dev pour l'API avec hot-reload (tsx watch, voir apps/api/Dockerfile).
  # Alternative optionnelle a `npm run start:dev` lance directement sur l'hote (README) :
  # utile pour developper sans installer Node localement, ou pour tester le Dockerfile.
  api:
    build:
      context: ../apps/api
      target: dev
    restart: unless-stopped
    env_file:
      - ../apps/api/.env
    environment:
      # Depuis le conteneur, Postgres est joignable via le nom de service, pas localhost.
      DATABASE_URL: postgres://nimbus:nimbus@postgres:5432/nimbus
      STORAGE_PATH: /app/storage
      # Les evenements fs natifs ne traversent pas toujours les bind mounts Docker Desktop
      # sur Windows/Mac : le polling garantit que le hot-reload (tsx watch) fonctionne en
      # conteneur (voir apps/api/Dockerfile, stage `dev`).
      CHOKIDAR_USEPOLLING: 'true'
    ports:
      - '3000:3000'
    volumes:
      - ../apps/api:/app
      - /app/node_modules
      - nimbus_api_dev_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy

  # Conteneur de dev pour le frontend avec hot-reload (vite dev --host).
  web:
    build:
      context: ../apps/web
      target: dev
    restart: unless-stopped
    env_file:
      - ../apps/web/.env
    environment:
      CHOKIDAR_USEPOLLING: 'true'
    ports:
      - '5173:5173'
    volumes:
      - ../apps/web:/app
      - /app/node_modules

volumes:
  nimbus_pg_dev_data:
  nimbus_api_dev_storage:
