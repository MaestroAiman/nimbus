# Sert le build statique React et retombe sur index.html pour les routes
# client-side (react-router) au lieu de renvoyer une 404 Nginx.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
