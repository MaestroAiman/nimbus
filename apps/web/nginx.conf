# Sert le build statique React et retombe sur index.html pour les routes
# client-side (react-router) au lieu de renvoyer une 404 Nginx.
#
# Config par defaut bakee dans l'image (statique seule, pas de reverse proxy API).
# En production (docker-compose.prod.yml), elle est remplacee par un bind mount vers
# infra/nginx/nginx.conf, qui ajoute le proxy /api -> NestJS (etape 10) — voir ce
# fichier pour le reverse proxy reellement utilise en prod.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
